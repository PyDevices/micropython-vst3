# Interlock - D dorian, 104 bpm, 32 bars from six one-bar cells.
#
# The whole piece is placement. Two tracks play the same `figure`, one of them
# shifted, so together they sound a line neither is playing on its own. From
# bar 17 that shift walks - 0.5, 0.75, 1.0, 1.25 - and then comes back, so the
# pair drifts apart and closes again without a single new note being written.
#
# Try it: change `key` to G and the whole song moves. Change one number in
# `figure` and it changes everywhere at once, which is the point of writing a
# song as cells instead of as a piano roll.

title: Interlock
tempo: 104
key: D
scale: dorian

patterns:

  # The hook. Quarter notes, deliberately sparse - the gaps are where the
  # second voice lands. [beat, length, degree, octave]
  # Note that everything finishes before beat 3: the last beat of the bar is
  # left empty so a shifted copy still lands inside the same bar. A cell whose
  # last event crosses the barline becomes a two-bar pattern, and then `repeat`
  # counts in twos - which is the easiest mistake to make in this format.
  figure:
    - [0.00, 0.45, 1, 4]    # D
    - [0.75, 0.45, 5, 4]    # A
    - [1.50, 0.45, 4, 4]    # G
    - [2.50, 0.45, 6, 4]    # B, the note that makes it dorian rather than minor

  # Bass. One bar of root, one of the flat seventh, alternated by placement.
  sub_d:
    - [0.0, 3.8, 1, 2]
  sub_c:
    - [0.0, 3.8, 7, 2]

  # [beat, drum name] - the instrument's own note map decides which key.
  pulse:
    - [0.0, kick]
    - [1.0, kick]
    - [2.0, kick]
    - [3.0, kick]
  hats:
    - [0.5, closed_hihat, 70]
    - [1.5, closed_hihat, 55]
    - [2.5, closed_hihat, 70]
    - [3.5, closed_hihat, 55]

  # Held chord, an octave under the plucks.
  pad:
    - [0.0, 3.9, 1, 3, 70]
    - [0.0, 3.9, 3, 3, 62]
    - [0.0, 3.9, 5, 3, 62]

aux_tracks:
  - name: Hall
    effect: Reverb
    preset: hall
    mix: 1.0

tracks:

  - name: Pluck A
    instrument: karplus
    gain_db: -2.0
    pan: -0.25
    sends:
      - to: Hall
        level: 0.35
    play:
      - {bar: 1,  pattern: figure, repeat: 32}

  # The same cell, half a beat later, on a different voice. Bars 17-24 walk
  # the offset out and back: this column is the composition.
  - name: Pluck B
    instrument: music_easel
    gain_db: -4.0
    pan: 0.25
    sends:
      - to: Hall
        level: 0.45
    play:
      - {bar: 9,  pattern: figure, repeat: 8, offset: 0.25}
      - {bar: 17, pattern: figure, offset: 0.25}
      - {bar: 18, pattern: figure, offset: 0.375}
      - {bar: 19, pattern: figure, offset: 0.50}
      - {bar: 20, pattern: figure, offset: 0.625}
      - {bar: 21, pattern: figure, offset: 0.75}
      - {bar: 22, pattern: figure, offset: 0.625}
      - {bar: 23, pattern: figure, offset: 0.50}
      - {bar: 24, pattern: figure, offset: 0.375}
      - {bar: 25, pattern: figure, repeat: 4, offset: 0.25}

  - name: Sub
    instrument: taurus
    gain_db: -1.0
    play:
      - {bar: 5,  pattern: sub_d, repeat: 2}
      - {bar: 7,  pattern: sub_c, repeat: 2}
      - {bar: 9,  pattern: sub_d, repeat: 2}
      - {bar: 11, pattern: sub_c, repeat: 2}
      - {bar: 13, pattern: sub_d, repeat: 2}
      - {bar: 15, pattern: sub_c, repeat: 2}
      - {bar: 17, pattern: sub_d, repeat: 2}
      - {bar: 19, pattern: sub_c, repeat: 2}
      - {bar: 21, pattern: sub_d, repeat: 2}
      - {bar: 23, pattern: sub_c, repeat: 2}
      - {bar: 25, pattern: sub_d, repeat: 2}
      - {bar: 27, pattern: sub_c, repeat: 2}
      - {bar: 29, pattern: sub_d, repeat: 4}

  - name: Kick
    instrument: tr808
    gain_db: -1.0
    play:
      - {bar: 9,  pattern: pulse, repeat: 16}

  - name: Hats
    instrument: tr808
    gain_db: -8.0
    play:
      - {bar: 11, pattern: hats, repeat: 14}

  - name: Pad
    instrument: solina
    gain_db: -6.0
    sends:
      - to: Hall
        level: 0.5
    play:
      - {bar: 17, pattern: pad, repeat: 16}

mix_bus:
  ceiling_db: -2.0
  gain_db: 8.0
